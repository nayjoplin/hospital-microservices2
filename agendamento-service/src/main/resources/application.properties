spring.application.name=agendamento-service
server.port=8081

spring.datasource.url=jdbc:mysql://mysql-agendamento:3306/agendamento_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq.queue.consulta=consulta.queue
rabbitmq.queue.exame=exame.queue
rabbitmq.exchange=hospital.exchange
rabbitmq.routingkey.consulta=consulta.routingkey
rabbitmq.routingkey.exame=exame.routingkey

service.clinica.url=http://clinica-service:8082
service.centro-cirurgico.url=http://centro-cirurgico-service:8083

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8090/realms/hospital
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8090/realms/hospital/protocol/openid-connect/certs

spring.security.oauth2.resourceserver.jwt.read-timeout=30s
spring.security.oauth2.resourceserver.jwt.connect-timeout=10s

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Configurações do Actuator (Healthcheck)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.rabbit.enabled=true

# Logging
logging.level.com.hospital.agendamento=INFO
logging.level.org.springframework.security=INFO
