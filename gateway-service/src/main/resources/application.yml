server:
  port: 8080

spring:
  application:
    name: gateway-service
  
  cloud:
    gateway:
      routes:
        - id: agendamento-service
          uri: http://agendamento-service:8081
          predicates:
            - Path=/api/cadastro/**, /api/pesquisa/**, /api/admin/**
          
        - id: clinica-service
          uri: http://clinica-service:8082
          predicates:
            - Path=/api/clinica/**
          
        - id: centro-cirurgico-service
          uri: http://centro-cirurgico-service:8083
          predicates:
            - Path=/api/procedimentos/**
      
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8090/realms/hospital
          read-timeout: 30s
          connect-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
