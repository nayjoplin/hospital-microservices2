spring.application.name=centro-cirurgico-service
server.port=8083

spring.datasource.url=jdbc:mysql://mysql-centro-cirurgico:3306/centro_cirurgico_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
rabbitmq.queue.exame=exame.queue
rabbitmq.exchange=hospital.exchange

rabbitmq.queue.consulta=consulta.queue
rabbitmq.routingkey.consulta=consulta.routingkey
rabbitmq.routingkey.exame=exame.routingkey

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8090/realms/hospital

spring.security.oauth2.resourceserver.jwt.read-timeout=30s
spring.security.oauth2.resourceserver.jwt.connect-timeout=10s

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.rabbit.enabled=true
